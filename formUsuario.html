<!-- Declara que o documento utiliza HTML5. -->
<!DOCTYPE html>

<!-- Define o português brasileiro como idioma da página. -->
<html lang="pt-BR">

    <!-- Reúne as configurações e os recursos utilizados pela página. -->
    <head>
        <!-- Define a codificação de caracteres, permitindo acentos e caracteres especiais. -->
        <meta charset="UTF-8">

        <!-- Ajusta a área de visualização à largura do dispositivo,
            com escala inicial de 100%. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Define o título exibido na aba do navegador. -->
        <title>Cadastro de Usuário</title>

        <!-- Importa os estilos gerais da página e da navegação. -->
        <link href="css/navBar.css" rel="stylesheet">

        <!-- Importa os estilos específicos dos formulários. -->
        <link href="css/estiloForm.css" rel="stylesheet">
    </head>

    <!-- Contém os elementos apresentados na página. -->
    <body>

        <!-- Cabeçalho com o logo, o nome e a apresentação do sistema. -->
        <header>
            <!-- src indica o caminho da imagem.
                style aplica CSS embutido para definir a largura em 200px. -->
            <img src="img/ifMarket.png" style="width:200px;">

            <!-- Texto de apresentação do sistema. -->
            <p>A plataforma de anúncios do IFPR campus TB!</p>
        </header>

        <!-- Área de navegação.
            aria-label fornece um nome para essa área às tecnologias assistivas. -->
        <nav aria-label="Navegação principal">

            <!-- Lista não ordenada com os links do menu. -->
            <ul>
                <!-- li representa um item da lista.
                    href define o destino do link.
                    title fornece uma informação adicional sobre o link. -->
                <li><a href="index.html" title="Ir para a página inicial">Página Inicial</a></li>
                <li><a href="sobre.html" title="Saiba mais sobre nós">Sobre</a></li>

                <!-- float: right posiciona o item à direita do menu.
                    A classe active aplica o destaque definido no CSS. -->
                <li style="float: right;"><a href="formLogin.html" title="Faça login para acessar o sistema" class="active">Login</a></li>
            </ul>
        </nav>

        <!-- Delimita o conteúdo principal da página.
            A classe main permite selecionar este elemento no CSS com .main. -->
        <main class="main">

            <!-- Agrupa o conteúdo do cadastro.
                secaoFormulario aplica a largura máxima e a centralização.
                aria-labelledby referencia o id do título que nomeia a seção. -->
            <section class="secaoFormulario" aria-labelledby="tituloCadastro">

                <!-- O id identifica o título de forma única na página. -->
                <h2 id="tituloCadastro">Cadastro de Usuário</h2>

                <!-- Orientação sobre o preenchimento dos campos. -->
                <p>Preencha os campos abaixo. Os campos com * são obrigatórios.</p>

                <!-- Formulário de cadastro.
                    class: associa o elemento aos estilos de .formulario.
                    action: indica o endereço que receberá os dados.
                    method="post": envia os dados no corpo da requisição.
                    enctype="multipart/form-data": permite enviar arquivos,
                    como a foto, junto aos demais campos.
                    actionUsuario.php será implementado na etapa de back-end. -->
                <form class="formulario" action="actionUsuario.php" method="post" enctype="multipart/form-data">

                    <!-- Agrupa o rótulo e o campo de seleção da foto. -->
                    <div class="campo">

                        <!-- for associa o rótulo ao input com id="fotoUsuario". -->
                        <label for="fotoUsuario">Foto</label>

                        <!-- type="file": permite selecionar um arquivo.
                            id: identifica o elemento na página.
                            name: define a identificação do campo no envio.
                            accept="image/*": orienta o seletor a oferecer imagens;
                            o arquivo também deverá ser validado no servidor.
                            Sem required, a seleção da foto é opcional. -->
                        <input type="file" id="fotoUsuario" name="fotoUsuario" accept="image/*">
                    </div>

                    <!-- Campo para informar o nome completo. -->
                    <div class="campo">
                        <label for="nomeUsuario">Nome completo *</label>

                        <!-- type="text": recebe texto.
                            autocomplete="name": informa ao navegador que o campo recebe um nome.
                            required: exige o preenchimento na validação do navegador. -->
                        <input type="text" id="nomeUsuario" name="nomeUsuario" autocomplete="name" required>
                    </div>

                    <!-- Campo para informar a data de nascimento. -->
                    <div class="campo">
                        <label for="dataNascimentoUsuario">Data de nascimento *</label>

                        <!-- type="date": permite informar uma data.
                            autocomplete="bday": identifica o campo como data de nascimento.
                            required: torna o preenchimento obrigatório. -->
                        <input type="date" id="dataNascimentoUsuario" name="dataNascimentoUsuario" autocomplete="bday" required>
                    </div>

                    <!-- Campo de seleção da cidade. -->
                    <div class="campo">
                        <label for="cidadeUsuario">Cidade *</label>

                        <!-- select apresenta uma lista de opções.
                            id associa o campo ao rótulo.
                            name identifica o campo no envio.
                            required exige a escolha de uma opção com valor não vazio. -->
                        <select id="cidadeUsuario" name="cidadeUsuario" required>

                            <!-- Opção inicial de orientação.
                                value="": representa um valor vazio.
                                selected: deixa esta opção selecionada inicialmente.
                                disabled: impede que o usuário selecione essa opção. -->
                            <option value="" selected disabled>Selecione uma cidade</option>

                            <!-- Cada option representa uma cidade.
                                value define o valor enviado quando ela é selecionada.
                                O conteúdo entre as tags é o texto exibido na lista. -->
                            <option value="Curiúva">Curiúva</option>
                            <option value="Imbaú">Imbaú</option>
                            <option value="Ortigueira">Ortigueira</option>
                            <option value="Reserva">Reserva</option>
                            <option value="Tibagi">Tibagi</option>
                            <option value="Telêmaco Borba">Telêmaco Borba</option>
                        </select>
                    </div>

                    <!-- Campo para informar o endereço de e-mail. -->
                    <div class="campo">
                        <label for="emailUsuario">E-mail *</label>

                        <!-- type="email": verifica o formato básico do endereço,
                            mas não confirma se a conta existe.
                            autocomplete="email": permite sugerir um e-mail salvo.
                            required: exige o preenchimento. -->
                        <input type="email" id="emailUsuario" name="emailUsuario" autocomplete="email" required>
                    </div>

                    <!-- Campo para cadastrar a senha. -->
                    <div class="campo">
                        <label for="senhaUsuario">Senha *</label>

                        <!-- type="password": oculta visualmente os caracteres digitados.
                            autocomplete="new-password": indica a criação de uma senha.
                            required: exige o preenchimento. -->
                        <input type="password" id="senhaUsuario" name="senhaUsuario" autocomplete="new-password" required>
                    </div>

                    <!-- Campo para repetir a senha escolhida. -->
                    <div class="campo">
                        <label for="confirmarSenhaUsuario">Confirmar senha *</label>

                        <!-- O HTML exige o preenchimento, mas não compara as senhas.
                            A comparação deverá ser implementada posteriormente. -->
                        <input type="password" id="confirmarSenhaUsuario" name="confirmarSenhaUsuario" autocomplete="new-password" required>
                    </div>

                    <!-- Agrupa os botões e permite estilizar suas características comuns. -->
                    <div class="acoes">

                        <!-- submit solicita o envio para o endereço definido em action,
                            após a validação dos campos pelo navegador.
                            A classe botao-acao aplica o destaque da ação principal. -->
                        <button type="submit" class="botao-acao">Cadastrar</button>

                        <!-- reset restaura os valores iniciais do formulário.
                            Neste caso, limpa os campos e restaura a opção inicial da cidade.
                            A classe botao-limpar define a aparência desse botão. -->
                        <button type="reset" class="botao-limpar">Limpar</button>
                    </div>
                </form>

            </section>
        </main>

        <!-- Rodapé com a identificação da instituição, do curso e da disciplina. -->
        <footer>
            IFPR Campus Telêmaco Borba - TADS - Disciplina de Tecnologias Web
        </footer>
    </body>
</html>
